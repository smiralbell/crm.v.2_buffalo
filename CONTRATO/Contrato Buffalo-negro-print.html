<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Contrato · Buffalo</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root{
    --paper:#FFFFFF;
    --ink:#111111;
    --ink-2:#2B2B2B;
    --muted:#7A7A7A;
    --rule:#111111;
    --accent:#111111;
    --watermark:#111111;
    --wm-opacity:0.05;

    --font-body:"IBM Plex Sans", Arial, Helvetica, sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, monospace;

    --page-w:210mm;
    --page-h:297mm;
    --page-pad-x:22mm;
    --page-pad-y:22mm;

    --body-size:11pt;
    --body-leading:1.6;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#EDEDED;color:var(--ink);
    font-family:var(--font-body);font-size:var(--body-size);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}

  .workspace{
    min-height:100vh;
    padding:40px 24px 96px;
    display:flex;flex-direction:column;align-items:center;gap:24px;
    background:#EDEDED;
  }
  .workspace-top{
    width:min(var(--page-w), 100%);
    display:flex;align-items:flex-end;justify-content:space-between;gap:24px;
    padding:0 4px;color:var(--ink-2);
  }
  .workspace-top .ws-meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .workspace-top .ws-title{font-weight:600;font-size:13px;letter-spacing:.01em}
  .workspace-top .ws-pages{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;color:var(--muted)}

  /* A4 page */
  .page{
    width:var(--page-w);
    height:var(--page-h);
    background:var(--paper);
    color:var(--ink);
    position:relative;
    overflow:hidden;
    box-shadow:
      0 0 0 0.5px rgba(0,0,0,.06),
      0 1px 2px rgba(0,0,0,.04),
      0 18px 40px -10px rgba(0,0,0,.12);
    isolation:isolate;
  }

  /* Watermark */
  .wm{
    position:absolute;inset:0;pointer-events:none;overflow:hidden;
    z-index:1;color:var(--watermark);opacity:var(--wm-opacity);
  }
  .wm-single{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .wm-single span{
    font-family:var(--font-body);font-weight:800;
    font-size:340px;letter-spacing:-0.04em;line-height:.85;
    transform:rotate(-28deg);white-space:nowrap;
  }
  .wm-diag{
    position:absolute;inset:-30%;
    display:grid;grid-template-columns:repeat(3,1fr);gap:24px;
    transform:rotate(-28deg);align-content:center;
  }
  .wm-diag span{
    font-family:var(--font-body);font-weight:800;
    font-size:120px;letter-spacing:-0.03em;line-height:.9;white-space:nowrap;
  }
  .wm-tile{
    position:absolute;inset:-10%;
    display:grid;grid-template-columns:repeat(6, 1fr);gap:6mm;
    transform:rotate(-12deg);
  }
  .wm-tile span{
    font-family:var(--font-body);font-weight:700;
    font-size:42px;letter-spacing:-0.02em;white-space:nowrap;
  }
  .wm-stamp{
    position:absolute;top:18mm;right:14mm;
    transform:rotate(8deg);
  }
  .wm-stamp span{
    font-family:var(--font-body);font-weight:800;
    font-size:90px;letter-spacing:-0.03em;line-height:.9;
  }
  .wm-perimeter{
    position:absolute;inset:0;
  }
  .wm-perimeter::before{
    content:"BUFFALO · BUFFALO · BUFFALO · BUFFALO · BUFFALO · BUFFALO ·";
    position:absolute;top:8mm;left:0;right:0;
    font-family:var(--font-mono);font-size:9px;letter-spacing:.4em;text-align:center;
  }
  .wm-perimeter::after{
    content:"BUFFALO · BUFFALO · BUFFALO · BUFFALO · BUFFALO · BUFFALO ·";
    position:absolute;bottom:8mm;left:0;right:0;
    font-family:var(--font-mono);font-size:9px;letter-spacing:.4em;text-align:center;
  }
  .wm-perimeter .center{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-body);font-weight:800;font-size:240px;
    letter-spacing:-0.04em;transform:rotate(-28deg);
  }

  /* Content layer */
  .page-inner{
    position:relative;z-index:2;
    width:100%;height:100%;
    padding: var(--page-pad-y) var(--page-pad-x) 32mm;
    display:flex;flex-direction:column;
  }

  /* Header (compact, only on first page actually — but we keep small header on all) */
  .doc-head{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:4mm;
    border-bottom:0.5px solid var(--rule);
    margin-bottom:10mm;
    font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  }
  .doc-head b{color:var(--ink);font-weight:500;letter-spacing:.12em}

  .doc-foot{
    position:absolute;
    left:var(--page-pad-x);right:var(--page-pad-x);bottom:var(--page-pad-y);
    margin:0;
    padding-top:3mm;
    border-top:0.5px solid var(--rule);
    display:flex;align-items:center;justify-content:space-between;
    font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    background:var(--paper);
  }
  .doc-foot b{color:var(--ink);font-weight:500}

  /* TITLE — looks like the user's screenshot */
  .doc-title{
    font-weight:800;
    font-size:26pt;
    line-height:1.1;
    letter-spacing:-0.01em;
    margin:0 0 6mm;
    text-transform:uppercase;
    text-wrap:balance;
  }

  .doc-date{
    font-size:11pt;
    color:var(--ink);
    margin:0 0 8mm;
  }

  hr.rule{
    border:0;border-top:0.5px solid var(--ink);
    margin:0 0 10mm;
  }

  /* Section headers — REUNIDOS, EXPONEN, etc. */
  h2.section{
    font-weight:800;
    font-size:14pt;
    text-transform:uppercase;
    letter-spacing:.01em;
    margin:0 0 6mm;
    line-height:1.1;
  }
  h2.section + .section-after{margin-top:0}

  /* Clause heading: "PRIMERA — OBJETO" */
  h3.clause{
    font-weight:700;
    font-size:11pt;
    text-transform:uppercase;
    letter-spacing:.02em;
    margin:7mm 0 3mm;
    line-height:1.25;
  }

  p.body{
    margin:0 0 4mm;
    line-height:var(--body-leading);
    color:var(--ink);
    text-align:left;
    hyphens:none;
    text-wrap:pretty;
  }
  p.body b, p.body strong{font-weight:600}

  /* Compact sub-list inside a clause */
  ol.list{
    margin:2mm 0 4mm;padding:0 0 0 6mm;
  }
  ol.list li{
    margin:0 0 2mm;line-height:var(--body-leading);
  }

  /* Dash list (— items) with hanging indent */
  ul.dash{list-style:none;margin:1.5mm 0 4mm;padding:0}
  ul.dash li{
    padding-left:6mm;text-indent:-6mm;
    margin:0 0 1.4mm;line-height:var(--body-leading);
  }
  p.sublabel{font-weight:600;margin:3mm 0 1.5mm}

  /* RED insertions (amendments / redline) */
  .ins{color:#C00000}
  .ins p.body,
  .ins p.sublabel,
  .ins ul.dash li,
  .ins h3.clause{color:#C00000}
  .ins p.body b,
  .ins p.sublabel b{color:#C00000}

  /* Signatures */
  .signatures{
    display:grid;grid-template-columns:1fr 1fr;gap:18mm;
    margin-top:14mm;
  }
  .sig-line{
    border-top:0.5px solid var(--ink);
    padding-top:2.5mm;
    margin-top:30mm;
  }
  .sig .who{font-weight:600;font-size:11pt}
  .sig .role{font-size:10pt;color:var(--ink-2);margin-top:.5mm}
  .sig .dni{font-family:var(--font-mono);font-size:9.5pt;color:var(--muted);margin-top:1mm}

  /* Font swaps */
  body[data-body="plex"]    { --font-body: "IBM Plex Sans", Arial, Helvetica, sans-serif }
  body[data-body="inter"]   { --font-body: "Inter", Arial, Helvetica, sans-serif }
  body[data-body="manrope"] { --font-body: "Manrope", Arial, Helvetica, sans-serif }
  body[data-body="system"]  { --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif }

  /* Density */
  body[data-density="tight"]   { --body-leading: 1.5; --body-size: 10.5pt }
  body[data-density="regular"] { --body-leading: 1.6; --body-size: 11pt }
  body[data-density="airy"]    { --body-leading: 1.75; --body-size: 11.5pt }

  /* PRINT */
  @page { size: A4; margin: 0; }
  @media print {
    html, body { background: #fff; }
    .workspace{padding:0;gap:0;background:#fff}
    .workspace-top, .twk-panel, [data-print-hide]{display:none !important}
    .page{
      box-shadow:none;width:210mm;height:297mm;
      page-break-after:always;break-after:page;
    }
    .page:last-child{page-break-after:auto}
  }
</style>

<style>
  .ins, .ins p.body, .ins p.sublabel, .ins ul.dash li, .ins h3.clause,
  .ins p.body b, .ins p.sublabel b { color: var(--ink) !important; }
</style>

</head>
<body data-body="plex" data-density="regular">

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#111"/>
    <text x="50" y="58" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="14" fill="#fff" letter-spacing="0.5">BUFFALO</text>
    <text x="50" y="74" text-anchor="middle" font-family="monospace" font-size="5" fill="#fff" opacity="0.6" letter-spacing="2">CONTRATO</text>
  </svg>
</template>

<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="contract.jsx"></script>


<script>
window.addEventListener('load', function(){
  function ready(){ return document.querySelectorAll('.page').length >= 8; }
  var tries = 0;
  (function wait(){
    if (ready() || tries > 120) {
      document.fonts.ready.then(function(){ setTimeout(function(){ window.print(); }, 700); });
    } else { tries++; setTimeout(wait, 100); }
  })();
});
</script>

</body>
</html>
